# ============================================================
# Vantara Customer Behavior Prediction Platform
# Central Project Configuration
# ============================================================

Project:
   name: "customer-behavior-predictions"
   version: "1.0"


# ============================================================
# Data Configuration
# ============================================================

data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

  # ----------------------------------------------------------
  # Raw Dataset Configuration
  # ----------------------------------------------------------

  online_retail_ii:
    uci_dataset_id: 502
    source: "UCI Machine Learning Repository"
    name: "Online Retail II"
    download_url: "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
    filename: "online_retail_II.xlsx"

  # ----------------------------------------------------------
  # Interim Dataset Configuration
  # ----------------------------------------------------------

  interim:
    cleaned_transactions:
      filename: "cleaned_transactions.csv"

  # ----------------------------------------------------------
  # Processed Dataset Configuration
  # ----------------------------------------------------------

  processed:
    customer_features:
      filename: "customer_features.csv"

    churn_dataset:
      filename: "customer_churn_dataset.csv"

    clv_dataset:
      filename: "CLV_dataset_90D.csv"
# ------------------------------------------------------------
# Dataset / Target Configuration
# ------------------------------------------------------------

targets:
  churn:
    prediction_window_days: 90
    cutoff:
      type: "max_date_minus_window"

  clv:
    prediction_window_days: 90
    cutoff:
      type: "max_date_minus_window"
# ------------------------------------------------------------
# Machine Learning Configuration
# ------------------------------------------------------------

model:
  random_state: 42

  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15

  cross_validation_folds: 5

  #------------------------------------------------------------
  # Classificatio model registry
  # ----------------------------------------------------------------

  classification:
  #-logistic regression------------------------------------------------
    logistic_regression:
      enabled: true
      feature_scaling: true
      base_parameters:
        random_state: 42
        max_iter: 1000
        solver: "liblinear"

  #- decision tree----------------------------
    decision_tree:
      enabled: true

      base_parameters:
        random_state: 42
        criterion: "gini"
        max_depth: 5
        min_samples_split: 2
        min_samples_leaf: 1

  #- random forest ----------------------------
    random_forest:
      model_name: "random_forest_tuned_v2"
      estimator_class: "RandomForestClassifier"
      artifact_format: "joblib"
      enabled: true
      feature_scaling: false
      base_parameters:
        random_state: 42
        n_estimators: 200
        criterion: "gini"
        max_depth: null
        min_samples_split: 2
        min_samples_leaf: 1
        n_jobs: -1

      hyperparameter_space:
        n_estimators: [200, 300, 400, 500]
        max_depth: [5, 10, 15, 20, null]
        min_samples_split: [2, 5, 10]
        min_samples_leaf: [1, 2, 4]
        max_features: ["sqrt", "log2", null]

  #- xgboost ----------------------------
    xgboost:
      model_name: "xgboost_tuned_v2"
      estimator_class: "XGBClassifier"
      artifact_format: "joblib"
      enabled: true
      feature_scaling: false
      base_parameters:
        random_state: 42
        n_estimators: 200
        learning_rate: 0.1
        max_depth: 6
        subsample: 1.0
        colsample_bytree: 1.0
        objective: "binary:logistic"
        eval_metric: "logloss"
        n_jobs: -1

      hyperparameter_space:
        n_estimators: [100, 200, 300]
        learning_rate: [0.01, 0.05, 0.1]
        max_depth: [3, 5, 7]
        subsample: [0.8, 1.0]
        colsample_bytree: [0.8, 1.0]

  #- lightgbm ----------------------------
    lightgbm:
      enabled: true
      feature_scaling: false
      base_parameters:
        random_state: 42
        n_estimators: 200
        learning_rate: 0.1
        max_depth: -1
        num_leaves: 31
        verbosity: -1
        n_jobs: -1


      hyperparameter_space:
        n_estimators: [100, 200, 300, 400, 500]
        learning_rate: [0.01, 0.03, 0.05, 0.1]
        max_depth: [-1, 3, 5, 7, 10]
        num_leaves: [15, 31, 50, 70, 100]
        min_child_samples: [10, 20, 30, 50]
        subsample: [0.7, 0.8, 0.9, 1.0]
        colsample_bytree: [0.7, 0.8, 0.9, 1.0]
        reg_alpha: [0.0, 0.01, 0.1, 0.5, 1.0]
        reg_lambda: [0.0, 0.01, 0.1, 0.5, 1.0]

  #- svm ----------------------------
    svm:
      enabled: true
      feature_scaling: true
      base_parameters:
         random_state: 42
         C: 1.0
         kernel: "rbf"
         gamma: "scale"
         probability: true

      hyperparameter_space:
        C: [0.1, 0.5, 1, 2, 5, 10, 50, 100]
        kernel: ["rbf", "linear"]
        gamma: ["scale", "auto", 0.001, 0.01, 0.1, 1]

  #----------------------------------------------------------------
  #---- Regression model registerys ----------------------------
  #----------------------------------------------------------------

  regression:
    tuning:
      scoring: neg_mean_absolute_error
      n_iter: 40
      n_jobs: -1

  #------ Linear regression-------------
    linear_regression:
      enabled: true
      feature_scaling: false
      base_parameters: {}
      hyperparameter_space:
        fit_intercept: [true, false]

  #------ ridge regression -------------
    ridge:
      enabled: true
      feature_scaling: true
      base_parameters:
        alpha: 1.0

      hyperparameter_space:
        alpha: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
        fit_intercept: [true, false]

  #------ decision tree------------------
    decision_tree:
      enabled: true
      feature_scaling: false
      base_parameters:
        random_state: 42
        max_depth: 5

  #------- random forest ----------------
    random_forest:
      enabled: true
      feature_scaling: false
      base_parameters:
        random_state: 42
        n_estimators: 200
        n_jobs: -1

      hyperparameter_space:
        n_estimators: [100, 200, 300, 500]
        max_depth: [null, 5, 10, 15, 20, 30]
        min_samples_split: [2, 5, 10, 20]
        min_samples_leaf: [1, 2, 5, 10]
        max_features: [1.0, sqrt, 0.5, 0.75]

  #------- xgboost -----------------------
    xgboost:
      enabled: true
      feature_scaling: false
      base_parameters:
        random_state: 42
        n_estimators: 300
        learning_rate: 0.05
        max_depth: 5
        objective: "reg:squarederror"
        n_jobs: -1

  #-------- lightgbm ---------------------
    lightgbm:
      enabled: true
      feature_scaling: false
      base_parameters:
        random_state: 42
        n_estimators: 200
        learning_rate: 0.05
        n_jobs: -1

  #--------- SVR --------------------------
    svr:
      enabled: true
      feature_scaling: true
      base_parameters:
        C: 1.0
        kernel: "rbf"
        gamma: "scale"

  #--------- lstm -------------------------
    lstm:
      enabled: true
      feature_scaling: false  # Already scaled by the sequence pipeline

      base_parameters:
        random_state: 42
        max_epochs: 60
        patience: 7
        lstm_units: 128
        dropout_rate: 0.20
        dense_units: 32
        learning_rate: 0.0001
        huber_delta: 10.0
        batch_size: 64

      hyperparameter_space:
        lstm_units: [64, 128]
        dropout_rate: [0.10, 0.20, 0.30]
        dense_units: [32, 64]
        learning_rate: [0.0001, 0.0003]
        huber_delta: [5.0, 10.0, 20.0]
        batch_size: [64, 128]

  deep_learning:
    tuning:
      enabled: true
      strategy: random_search
      max_trials: 15
      objective_direction: minimize
      seed: 42

    training:
      epochs: 100
      batch_size: 32
      early_stopping:
        monitor: val_loss
        patience: 10
        restore_best_weights: true
      reduce_lr:
        enabled: true
        factor: 0.5
        patience: 5
        min_lr: 0.000001

    models:
       churn_ann:
         task_type: classification
         input_type: tabular
         objective: val_auc
         objective_direction: maximize
         search_space:
           hidden_units:
              - [64, 32, 16]
              - [128, 64, 32]
              - [128, 64, 32, 16]
              - [64, 32]
           dropout_rate: [0.10,0.20, 0.30, 0.40]
           learning_rate: [0.001, 0.0005, 0.0001]
           batch_size: [32, 64, 128]
           activation: [relu,elu]

       clv_dnn:
          task_type: regression
          input_type: tabular
          objective: val_loss
          objective_direction: minimize
          search_space:
            hidden_units:
              - [64, 32]
              - [128, 64]
              - [128, 64, 32]
            dropout_rate: [0.2, 0.3, 0.4]
            learning_rate: [0.001, 0.0005, 0.0001]
            batch_size: [32, 64, 128]
            activation: [relu]

       purchase_timing_lstm:
          task_type: sequence_prediction
          input_type: sequence
          objective: val_loss
          objective_direction: minimize
          search_space:
            lstm_units: [32, 64, 128]
            dropout_rate: [0.2, 0.3, 0.4]
            learning_rate: [0.001, 0.0005, 0.0001]
            batch_size: [32, 64]

  customer_anamoly_autoencoder:
     task_type: anomaly_detection
     input_type: tabular
     objective: val_loss
     objective_direction: minimize

     architecture:
       hidden_dim: 16
       encoding_dim: 8
       learning_rate: 0.001

     training:
       epochs: 100
       batch_size: 32
       early_stopping:
        monitor: val_loss
        patience: 10
        restore_best_weights: true

     anomaly_threshold:
       method: training_reconstruction_error_percentile
       percentile: 97.5


#------------------------------------------------------------
# Model artifacts:
# -----------------------------------------------------------

model_artifacts:
   model_dir: "model_artifacts/models"
   preprocessing_dir: "model_artifacts/preprocessing"

   churn:
      scaler_filename: "churn_scaler.joblib"

   clv:
      scaler_filename: "clv_scaler.joblib"

   segmentation:
      scaler_type: "StandardScaler"
      scaler_filename: "segmentation_scaler.joblib"

   autoencoder:
     model_name: "customer_anomaly_autoencoder"
     model_type: "autoencoder"
     preprocessing_filename: "customer_anomaly_autoencoder_preprocessing.joblib"
     metadata_filename: "customer_anomaly_autoencoder_metadata.joblib"
     threshold: 1.368
     threshold_percentile: 97.5
     scaler_type: "StandardScaler"


# ------------------------------------------------------------
# Clustering Configuration
# ------------------------------------------------------------

clustering:
  random_state: 42

# ------------------------------------------------------------
# API Configuration
# ------------------------------------------------------------

api:
  host: "127.0.0.1"
  port: 8000

# ------------------------------------------------------------
# Database Configuration
# -----------------------------------------------------------

database:
  host: "localhost"
  port: 5432
  name: "customer_behavior"
